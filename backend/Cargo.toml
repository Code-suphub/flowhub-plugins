[package]
name = "flowhub-machines"
version = "0.2.0"
edition = "2021"

[dependencies]
glob = "0.3"
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["system-proxy", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minisign-verify = "0.2.5"
semver = "1"
sha2 = "0.10.9"
tokio = { version = "1", features = ["full"] }
url = "2.5.8"
