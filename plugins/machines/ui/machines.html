<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FlowHub · 机器管理</title><link data-flowhub-common rel="stylesheet"><link rel="stylesheet" href="machines.css"><link rel="stylesheet" href="machine-controls.css"><link rel="stylesheet" href="widget/widget-settings.css"><link rel="stylesheet" href="monitoring/netdata.css"><link rel="stylesheet" href="cloud/cloud-traffic.css"><link data-flowhub-fleet rel="stylesheet"></head>
<body>
  <header class="masthead"><div><span class="eyebrow">FLOWHUB / LOCAL OPERATIONS</span><h1>机器管理<span class="version" id="version"></span></h1></div><div class="actions"><div id="backupReactRoot"></div></div></header>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
  <div id="unavailable" class="empty" hidden><h2>机器插件尚未启用</h2><p>请在 FlowHub 设置的「插件市场」中安装或启用。</p></div>
  <main hidden>
    <div class="machine-tabs" role="tablist" aria-label="机器管理页面"><button id="fleetTab" role="tab" data-machine-tab="fleet" aria-selected="true" aria-controls="fleetPanel" tabindex="0">机器</button><button id="commandTab" role="tab" data-machine-tab="command" aria-selected="false" aria-controls="commandPanel" tabindex="-1">远程命令</button><button id="historyTab" role="tab" data-machine-tab="history" aria-selected="false" aria-controls="historyPanel" tabindex="-1">执行记录</button></div>
    <section id="fleetPanel" role="tabpanel" aria-labelledby="fleetTab"><div id="fleetReactRoot"></div></section>
    <section id="commandPanel" role="tabpanel" aria-labelledby="commandTab" hidden><div id="commandReactRoot"></div></section>
    <section id="historyPanel" role="tabpanel" aria-labelledby="historyTab" hidden><div id="historyReactRoot"></div></section>
  </main>
  <div id="collectionsReactRoot"></div>
  <div id="hostMenu" class="row-menu" role="menu" hidden></div><div id="hostEditorReactRoot"></div>

<script src="plugin-bridge.js"></script><script src="widget/widget-settings-bridge.js"></script><script data-flowhub-common></script><script data-flowhub-fleet></script><script src="machine-tabs.js"></script><script src="cloud/machine-regions.js"></script><script src="machines.js"></script><script src="machine-selects.js"></script><script src="monitoring/monitoring.js"></script><script src="monitoring/netdata.js"></script><script src="cloud/cloud-traffic.js"></script></body></html>
