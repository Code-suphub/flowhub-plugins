[package]
name = "flowhub-twofa"
version = "0.3.0"
edition = "2021"

[dependencies]
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "io-util", "io-std", "rt-multi-thread"] }
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "otpauth", "zeroize"] }
url = "2.5"
